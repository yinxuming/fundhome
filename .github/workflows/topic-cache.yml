name: Update Topic Cache

on:
  schedule:
    - cron: '37 8 * * 1-5'
    - cron: '37 12 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: topic-cache
  cancel-in-progress: false

jobs:
  update-topic-cache:
    environment:
      name: github-pages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Check if today is a trading day
        id: trading-day
        run: |
          python3 << 'EOF'
          import datetime, sys
          today = datetime.date.today()
          if today.weekday() >= 5:
              print('skip=true')
              sys.exit(0)
          holidays_2026 = {
              '2026-01-01','2026-01-02','2026-01-03',
              '2026-02-16','2026-02-17','2026-02-18','2026-02-19','2026-02-20',
              '2026-04-04','2026-04-05','2026-04-06',
              '2026-05-01','2026-05-02','2026-05-03','2026-05-04','2026-05-05',
              '2026-05-30','2026-05-31','2026-06-01',
              '2026-10-01','2026-10-02','2026-10-03','2026-10-04','2026-10-05','2026-10-06','2026-10-07',
          }
          if today.isoformat() in holidays_2026:
              print('skip=true')
              sys.exit(0)
          print('skip=false')
          EOF

      - name: Check if cache already updated today after market close
        if: steps.trading-day.outputs.skip != 'true'
        id: check-cache
        run: |
          if [ -f "data/topic-cache.json" ]; then
            result=$(python3 << 'EOF'
          import json, sys, datetime, zoneinfo
          with open('data/topic-cache.json') as f:
              data = json.load(f)
          for v in data.values():
              if isinstance(v, dict) and 'date' in v:
                  cached_str = v['date']
                  try:
                      cached_dt = datetime.datetime.strptime(cached_str, '%Y-%m-%d %H:%M:%S')
                  except ValueError:
                      print('invalid')
                      sys.exit(0)
                  tz_bj = zoneinfo.ZoneInfo('Asia/Shanghai')
                  now_bj = datetime.datetime.now(tz_bj)
                  today = now_bj.date()
                  if cached_dt.date() != today:
                      print('stale')
                      sys.exit(0)
                  if cached_dt.hour >= 15:
                      print('closed')
                      sys.exit(0)
                  print('intraday')
                  sys.exit(0)
          print('empty')
          EOF
          )
            echo "Cache status: $result"
            if [ "$result" = "closed" ]; then
              echo "already_updated=true" >> "$GITHUB_OUTPUT"
              echo "Cache is from today after market close, no need to update"
            else
              echo "already_updated=false" >> "$GITHUB_OUTPUT"
              if [ "$result" = "intraday" ]; then
                echo "Cache is from today but before market close, will refresh"
              elif [ "$result" = "stale" ]; then
                echo "Cache is from a previous day, will update"
              else
                echo "Cache date format invalid or empty, will update"
              fi
            fi
          else
            echo "already_updated=false" >> "$GITHUB_OUTPUT"
            echo "No cache file found"
          fi

      - name: Fetch topic gains data
        if: steps.trading-day.outputs.skip != 'true' && steps.check-cache.outputs.already_updated != 'true'
        id: fetch-data
        run: |
          mkdir -p data
          python3 << 'PYEOF'
          import json, urllib.request, datetime, sys, zoneinfo

          tz_bj = zoneinfo.ZoneInfo('Asia/Shanghai')
          now_bj = datetime.datetime.now(tz_bj)
          now_str = now_bj.strftime('%Y-%m-%d %H:%M:%S')

          # Helper: fetch topic API
          def fetch_topic(st):
              url = 'https://api.fund.eastmoney.com/ztjj/GetZTJJListNew?tt=0&dt=syl&st=' + st + '&_=' + str(int(now_bj.timestamp() * 1000))
              req = urllib.request.Request(url, headers={
                  'Referer': 'https://fund.eastmoney.com/',
                  'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36'
              })
              with urllib.request.urlopen(req, timeout=30) as resp:
                  text = resp.read().decode('utf-8')
              if '(' in text and ')' in text:
                  text = text[text.index('(')+1:text.rindex(')')]
              data = json.loads(text)
              if data.get('ErrCode') != 0:
                  print(f'API error for st={st}: ErrCode={data.get("ErrCode")}', file=sys.stderr)
                  return []
              return data.get('Data', [])

          # 1. Fetch daily gains (st=D)
          items = fetch_topic('D')
          if not items:
              print('No daily data returned', file=sys.stderr)
              sys.exit(1)

          # 2. Determine latest trading day from first item's date
          # The API returns 'PDATE' field (YYYY-MM-DD) for the latest trading date
          latest_trade_date = items[0].get('PDATE', '')
          if not latest_trade_date:
              latest_trade_date = now_bj.date().isoformat()
          print(f'Latest trade date from API: {latest_trade_date}')

          # 3. Fetch period gains (W/M/Q/Y/SY) separately
          period_gains = {}  # { INDEXCODE: { W, M, Q, Y, SY } }
          for st in ('W', 'M', 'Q', 'Y', 'SY'):
              period_items = fetch_topic(st)
              if not period_items:
                  print(f'Warning: No data for st={st}', file=sys.stderr)
                  continue
              for item in period_items:
                  code = item['INDEXCODE']
                  if code not in period_gains:
                      period_gains[code] = {}
                  val = item.get(st, item.get('D'))
                  if val is not None:
                      period_gains[code][st] = round(val, 2)
              print(f'Fetched {len(period_items)} items for st={st}')

          # 4. Load existing cache
          existing = {}
          try:
              with open('data/topic-cache.json') as f:
                  existing = json.load(f)
          except FileNotFoundError:
              pass

          # 5. Build result
          result = {}
          for item in items:
              name = item['INDEXNAME']
              code = item['INDEXCODE']
              gain = round(item.get('D', 0), 2)

              old_entry = existing.get(name, {})
              old_gains = old_entry.get('dailyGains', {}) if isinstance(old_entry, dict) else {}

              daily_gains = dict(old_gains)
              # Use latest_trade_date as key, not actual date
              daily_gains[latest_trade_date] = gain

              sorted_dates = sorted(daily_gains.keys(), reverse=True)
              for d in sorted_dates[30:]:
                  del daily_gains[d]

              pg = period_gains.get(code, {})
              result[name] = {
                  'id': code,
                  'name': name,
                  'date': now_str,
                  'dailyGains': daily_gains,
                  'W': pg.get('W', 0),
                  'M': pg.get('M', 0),
                  'Q': pg.get('Q', 0),
                  'Y': pg.get('Y', 0),
                  'SY': pg.get('SY', 0),
              }

          with open('data/topic-cache.json', 'w', encoding='utf-8') as f:
              json.dump(result, f, ensure_ascii=False, indent=2)

          print(f'Updated {len(result)} topics, date={now_str}, trade_date={latest_trade_date}')
          PYEOF
          echo "data_updated=true" >> "$GITHUB_OUTPUT"

      - name: Commit and push if changed
        if: steps.fetch-data.outputs.data_updated == 'true'
        run: |
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add data/topic-cache.json
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            today=$(date +%Y-%m-%d)
            git commit -m "chore: update topic cache ${today}"
            git pull --rebase origin main || echo "git pull failed, will attempt push anyway"
            git push
          fi

      - name: Keep alive
        if: steps.trading-day.outputs.skip == 'true' || steps.check-cache.outputs.already_updated == 'true'
        run: |
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          LAST_COMMIT_DATE=$(git log -1 --format=%cd --date=short)
          TODAY=$(date +%Y-%m-%d)
          if [ "$LAST_COMMIT_DATE" != "$TODAY" ]; then
            echo "No commit today, creating keep-alive commit"
            mkdir -p data
            echo "${TODAY}" > data/.keep-alive
            git add data/.keep-alive
            git commit -m "chore: keep alive ${TODAY}"
            git pull --rebase origin main || echo "git pull failed, will attempt push anyway"
            git push
          else
            echo "Already have a commit today (${TODAY}), skipping keep-alive"
          fi

      - name: Setup Pages
        if: steps.fetch-data.outputs.data_updated == 'true'
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload artifact
        if: steps.fetch-data.outputs.data_updated == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        if: steps.fetch-data.outputs.data_updated == 'true'
        id: deployment
        uses: actions/deploy-pages@v4
