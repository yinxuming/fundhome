name: Update Fund Holdings Cache

on:
  schedule:
    # 季度更新窗口：1/4/7/10月27-31日 + 2/5/8/11月1-5日，每天3次（北京4:00, 10:00, 16:00）
    # 每次最长运行4.5小时，未完成的基金在下次运行继续（断点续传）
    - cron: '0 20,2,8 27-31 1,4,7,10 *'
    - cron: '0 20,2,8 1-5 2,5,8,11 *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: fund-holdings-cache
  cancel-in-progress: false

jobs:
  update-fund-holdings:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Pull latest changes
        run: |
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git pull --rebase origin main || echo "git pull failed, continue with checkout state"

      - name: Fetch fund holdings data
        id: fetch-data
        run: |
          mkdir -p data
          python3 << 'PYEOF'
          import json, urllib.request, urllib.parse, sys, datetime, zoneinfo, os, re, time, random
          from concurrent.futures import ThreadPoolExecutor, as_completed
          from collections import defaultdict

          tz_bj = zoneinfo.ZoneInfo('Asia/Shanghai')
          today = datetime.datetime.now(tz_bj).date()
          today_str = today.isoformat()

          # 单次运行最大时长（秒），留1.5小时余量给commit/deploy步骤
          MAX_RUNTIME = 4.5 * 3600
          run_start_time = time.time()

          # ========== 去重函数（复用 streak-rank.yml 逻辑） ==========
          def get_base_fund_name(fund_name):
              """提取基金基础名称（去掉份额类别和币种后缀）"""
              CURRENCY = r'(?:人民币|美元|美元汇|美元现钞)'
              base = fund_name
              base = re.sub(r'[A-Z]类' + CURRENCY + r'$', '', base).strip()
              base = re.sub(r'\(.+?\)[A-Z]' + CURRENCY + r'$', '', base).strip()
              base = re.sub(r'[A-Z]' + CURRENCY + r'$', '', base).strip()
              patterns = [
                  r'[A-Z]类$', r'[A-Z]$', r'\(.*?\)$',
                  r'I$', r'II$', r'III$', r'IV$', r'V$',
                  r'1$', r'2$', r'3$', r'4$', r'5$',
              ]
              for p in patterns:
                  base = re.sub(p, '', base).strip()
              base = re.sub(r'\(.+?\)$', '', base).strip()
              return base

          def fund_class_priority(fund_name):
              """基金份额优先级（越小越高），C类优先。
              复用 streak-rank.yml 的 has_class 实现，支持多种命名格式。"""
              is_rmb = '人民币' in fund_name
              is_usd = '美元' in fund_name
              is_ab = bool(re.search(r'A/B|A\\B|\(A/B\)|\(A\\B\)', fund_name))

              def has_class(letter):
                  return bool(re.search(
                      rf'{letter}[类(]|{letter}\((?:人民币|美元|美元汇|美元现钞)\)'
                      rf'|(.+?){letter}(?:人民币|美元|美元汇|美元现钞)'
                      rf'|(.+?){letter}$|(?:人民币|美元|美元汇|美元现钞){letter}$'
                      rf'|(?<=[^a-zA-Z0-9]){letter}$', fund_name))

              is_a = has_class('A') and not is_ab
              is_c = has_class('C')
              is_e = has_class('E')
              is_d = has_class('D')

              if is_c:
                  return 0 if is_rmb else 10 if is_usd else 1
              elif is_ab:
                  return 2 if is_rmb else 10 if is_usd else 3
              elif is_a:
                  return 4 if is_rmb else 10 if is_usd else 5
              elif is_e:
                  return 6 if is_rmb else 10 if is_usd else 7
              elif is_d:
                  return 8 if is_rmb else 10 if is_usd else 9
              return 10

          def is_c_class(fund_name):
              """判断是否为C类基金（优先级0或1，即C类人民币或C类）"""
              return fund_class_priority(fund_name) in (0, 1)

          # ========== 1. 获取全部基金代码 + 名称 + 规模 ==========
          def hash_v(s):
              h = 0
              for c in s:
                  h = ((h << 5) - h) + ord(c)
                  h &= 0xFFFFFFFF
              return str(h)

          # all_funds: {code: {name, scale}}
          all_funds = {}
          page = 1
          page_size = 10000
          while True:
              v = hash_v(today_str + str(page))
              params = {
                  'op': 'ph', 'dt': 'kf', 'ft': 'all', 'rs': '', 'gs': '0',
                  'sc': '1nzf', 'st': 'desc', 'pi': str(page), 'pn': str(page_size), 'dx': '1', 'v': v
              }
              url = 'https://fund.eastmoney.com/data/rankhandler.aspx?' + urllib.parse.urlencode(params)
              req = urllib.request.Request(url, headers={
                  'Referer': 'https://fund.eastmoney.com/data/diyfundranking.html',
                  'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36'
              })
              try:
                  with urllib.request.urlopen(req, timeout=30) as resp:
                      text = resp.read().decode('utf-8')
              except Exception as e:
                  print(f'Fetch failed page={page}: {e}', file=sys.stderr)
                  break

              datas_match = re.search(r'datas:\s*(\[.*?\])\s*,\s*allRecords', text, re.DOTALL)
              if not datas_match:
                  print(f'No datas array found page={page}', file=sys.stderr)
                  break
              try:
                  datas = json.loads(datas_match.group(1))
              except json.JSONDecodeError as e:
                  print(f'datas parse failed page={page}: {e}', file=sys.stderr)
                  break
              if not datas:
                  break

              all_records_match = re.search(r'allRecords:\s*(\d+)', text)
              all_records = int(all_records_match.group(1)) if all_records_match else 0

              for item in datas:
                  fields = item.split(',')
                  if len(fields) < 2:
                      continue
                  fund_code = fields[0].strip()
                  fund_name = fields[1].strip()
                  # field[24] = 基金规模（亿元）
                  fund_scale = fields[24].strip() if len(fields) > 24 else ''
                  if fund_code:
                      all_funds[fund_code] = {'name': fund_name, 'scale': fund_scale}

              if page * page_size >= all_records or len(datas) < page_size:
                  break
              page += 1

          print(f'Total funds fetched: {len(all_funds)}')
          if not all_funds:
              print('No funds fetched, abort', file=sys.stderr)
              sys.exit(0)

          # ========== 2. 筛选权益类基金（按名称排除债券/货币） + C类去重 ==========
          # 按名称排除债券型和货币型基金
          equity_funds = {}
          for code, info in all_funds.items():
              name = info['name']
              if '债' in name or '货币' in name:
                  continue
              equity_funds[code] = info
          print(f'After bond/money filter: {len(equity_funds)}')

          # C类去重：同名基金只保留优先级最高的（C类优先）
          groups = defaultdict(list)
          for code, info in equity_funds.items():
              base = get_base_fund_name(info['name'])
              groups[base].append((code, info))

          deduped_funds = {}  # {code: {name, scale}}
          # TODO 624: same_fund_to_c 替代 a2c_map，仅存有对应C类的映射（非C类→C类）
          same_fund_to_c = {}  # {非C类code: C类code}
          c2a_map = defaultdict(list)  # {C类code: [非C类code]}，用于scale回退

          for base, group in groups.items():
              if len(group) == 1:
                  code, info = group[0]
                  deduped_funds[code] = info
              else:
                  # 按优先级排序，取最高的（C类优先）
                  sorted_group = sorted(group, key=lambda x: fund_class_priority(x[1]['name']))
                  kept_code, kept_info = sorted_group[0]
                  deduped_funds[kept_code] = kept_info
                  # 构建同名基金→C类映射：仅当保留的是C类时，其他非C类指向它
                  if is_c_class(kept_info['name']):
                      for code, info in sorted_group[1:]:
                          if not is_c_class(info['name']):
                              same_fund_to_c[code] = kept_code
                              c2a_map[kept_code].append(code)

          print(f'After C-class dedup: {len(deduped_funds)} funds, same_fund_to_c mappings: {len(same_fund_to_c)}')

          # ========== 3. 加载已有缓存（断点续传） ==========
          # TODO 625: 拆分为 3 个独立文件，主数据只存消费方需要的字段
          #   - fund-holdings-cache.json: 主数据（last_update + stocks + funds），消费方使用
          #   - fund-holdings-cache-state.json: 定期任务状态（main_run_date + updates），仅YML使用
          #   - same_fund_to_code_c.json: 同名基金→C类映射（每次全量覆盖）
          cache_file = 'data/fund-holdings-cache.json'
          state_file = 'data/fund-holdings-cache-state.json'
          existing = {'last_update': '', 'stocks': [], 'funds': {}}
          try:
              with open(cache_file, encoding='utf-8') as f:
                  existing = json.load(f)
          except FileNotFoundError:
              print('No existing cache file')
          except Exception as e:
              print(f'Read existing failed: {e}', file=sys.stderr)

          existing_funds = existing.get('funds', {})
          existing_stocks = existing.get('stocks', [])

          # 加载定期任务状态文件（断点续传数据）
          state = {'main_run_date': '', 'updated_count': 0, 'total_count': 0, 'updates': {}}
          try:
              with open(state_file, encoding='utf-8') as f:
                  state = json.load(f)
          except FileNotFoundError:
              print('No existing state file')
          except Exception as e:
              print(f'Read existing state failed: {e}', file=sys.stderr)

          existing_updates = state.get('updates', {})
          main_run_date = state.get('main_run_date', '')

          # 构建股票名称→序号查表（用于h字段36进制编码）
          stock_name_to_idx = {}
          for idx, name in enumerate(existing_stocks):
              if name not in stock_name_to_idx:
                  stock_name_to_idx[name] = idx

          # 检查是否需要开始新季度的更新（上次主任务超过30天则重置）
          if main_run_date:
              try:
                  main_date = datetime.date.fromisoformat(main_run_date)
                  days_since_main = (today - main_date).days
              except ValueError:
                  days_since_main = 999
              if days_since_main > 30:
                  print(f'Previous main_run_date was {days_since_main} days ago, starting new quarter')
                  main_run_date = ''

          # 确定跳过日期：已在本季度更新过的基金直接跳过
          # TODO 623: 使用顶层 updates 映射（逗号分隔字符串）替代每基金 u 字段
          if main_run_date:
              skip_date = main_run_date
              print(f'Continuing quarter run (main_run_date={main_run_date})')
          else:
              skip_date = today_str
              state['main_run_date'] = today_str
              print(f'Starting new quarter (main_run_date={today_str})')

          # 解析已更新的基金code集合（从 updates 字符串解析）
          updates_str = existing_updates.get(skip_date, '')
          updated_code_set = set(updates_str.split(',')) if updates_str else set()

          # ========== 4. 预筛选待更新基金 ==========
          funds_to_update = []
          skipped_count = 0
          for code, info in deduped_funds.items():
              if code in updated_code_set:
                  skipped_count += 1
              else:
                  funds_to_update.append((code, info))

          total = len(deduped_funds)
          print(f'To update: {len(funds_to_update)}, already done: {skipped_count}, total: {total}')

          if not funds_to_update:
              print('All funds already updated this quarter, skipping run')
              sys.exit(0)

          # ========== 5. 获取基金重仓（并发 + 时间限制 + 增量写入） ==========
          def fetch_jjcc(fund_code):
              """获取基金前十大重仓股，返回 holdings 列表或 None（请求失败）"""
              url = f'https://fundf10.eastmoney.com/FundArchivesDatas.aspx?type=jjcc&code={fund_code}&topline=10&year=&month=&_={int(time.time()*1000)}'
              req = urllib.request.Request(url, headers={
                  'Referer': 'https://fund.eastmoney.com/',
                  'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36'
              })
              try:
                  with urllib.request.urlopen(req, timeout=15) as resp:
                      text = resp.read().decode('utf-8')
              except Exception:
                  return None

              content_match = re.search(r'content\s*:\s*"([\s\S]*?)"\s*,\s*arryear', text)
              if not content_match:
                  content_match = re.search(r'content\s*:\s*"([\s\S]*?)"\s*,', text)
              if not content_match:
                  return []

              html = content_match.group(1)
              html = html.replace('\\/', '/').replace('\\"', '"').replace('\\n', '\n')

              header_row = re.search(r'<thead[\s\S]*?<tr[\s\S]*?</tr>[\s\S]*?</thead>', html, re.IGNORECASE)
              header_cells = []
              if header_row:
                  header_cells = [re.sub(r'<[^>]*>', '', th).strip() for th in re.findall(r'<th[^>]*>([\s\S]*?)</th>', header_row.group(0), re.IGNORECASE)]

              idx_code = -1
              idx_name = -1
              idx_weight = -1
              for i, h in enumerate(header_cells):
                  t = h.replace(' ', '')
                  if idx_code < 0 and ('股票代码' in t or '证券代码' in t):
                      idx_code = i
                  if idx_name < 0 and ('股票名称' in t or '证券名称' in t):
                      idx_name = i
                  if idx_weight < 0 and ('占净值比例' in t or '占比' in t):
                      idx_weight = i

              tbody = re.search(r'<tbody[\s\S]*?</tbody>', html, re.IGNORECASE)
              if tbody:
                  rows = re.findall(r'<tr[\s\S]*?</tr>', tbody.group(0), re.IGNORECASE)
              else:
                  rows = re.findall(r'<tr[\s\S]*?</tr>', html, re.IGNORECASE)

              holdings = []
              for row in rows:
                  tds = [re.sub(r'<[^>]*>', '', td).strip() for td in re.findall(r'<td[^>]*>([\s\S]*?)</td>', row, re.IGNORECASE)]
                  if not tds:
                      continue

                  code = ''
                  name = ''
                  weight = 0.0

                  if idx_code >= 0 and idx_code < len(tds):
                      m = re.search(r'(\d{6})', tds[idx_code])
                      if m:
                          code = m.group(1)
                      else:
                          m = re.search(r'(\d{5})', tds[idx_code])
                          if m:
                              code = m.group(1)
                          else:
                              m = re.search(r'\b([A-Za-z]{1,10})\b', tds[idx_code])
                              if m:
                                  code = m.group(1).upper()
                  else:
                      for td in tds:
                          m = re.search(r'^\d{6}$', td)
                          if m:
                              code = m.group(0)
                              break

                  if idx_name >= 0 and idx_name < len(tds):
                      name = tds[idx_name]
                  elif code:
                      for td in tds:
                          if td and td != code and not re.search(r'\d+(?:\.\d+)?\s*%', td):
                              name = td
                              break

                  if idx_weight >= 0 and idx_weight < len(tds):
                      wm = re.search(r'([\d.]+)\s*%', tds[idx_weight])
                      if wm:
                          weight = float(wm.group(1))
                  else:
                      for td in tds:
                          wm = re.search(r'([\d.]+)\s*%', td)
                          if wm:
                              weight = float(wm.group(1))
                              break

                  if code or name:
                      holdings.append([code, name, weight])

              return holdings

          def fetch_pingzhongdata(fund_code):
              """获取基金 pingzhongdata（含股票代码列表和规模）
              返回 (stock_codes, fund_scale) 或 (None, None)
              - stock_codes: 6位股票代码列表（去掉最后1位市场标识）
              - fund_scale: 最新规模（亿元），来自 Data_fluctuationScale.series[-1].y
              """
              url = f'https://fund.eastmoney.com/pingzhongdata/{fund_code}.js'
              req = urllib.request.Request(url, headers={
                  'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36'
              })
              try:
                  with urllib.request.urlopen(req, timeout=15) as resp:
                      text = resp.read().decode('utf-8')
              except Exception:
                  return None, None

              # 解析 stockCodes：去掉末位市场标识，按长度区分A股/港股
              # A股: 7位 = 6位代码 + 1位市场标识(0=深市,1=沪市) → 取前6位
              # 港股: 8位 = 5位代码 + 3位后缀(如116) → 取前5位
              # 美股: 字母代码(如AAPL) → 保留原值
              stock_codes = []
              codes_match = re.search(r'var\s+stockCodes\s*=\s*(\[.*?\]);', text)
              if codes_match:
                  try:
                      raw_codes = json.loads(codes_match.group(1))
                      for c in raw_codes:
                          s = str(c)
                          if s.isdigit() and len(s) == 7:
                              stock_codes.append(s[:6])  # A股: 6位代码+1位市场标识
                          elif s.isdigit() and len(s) == 8:
                              stock_codes.append(s[:5])  # 港股: 5位代码+3位后缀
                          elif s.isdigit() and len(s) <= 6:
                              stock_codes.append(s)      # 纯数字代码(6位A股或5位港股)
                          else:
                              stock_codes.append(s)      # 非数字(美股代码等)或其他格式
                  except Exception:
                      pass

              # 解析 Data_fluctuationScale：取最新规模（series[-1].y）
              fund_scale = ''
              scale_match = re.search(r'Data_fluctuationScale\s*=\s*(\{.*?\});', text, re.DOTALL)
              if scale_match:
                  try:
                      scale_data = json.loads(scale_match.group(1))
                      series = scale_data.get('series', [])
                      if series:
                          latest = series[-1].get('y', 0)
                          if latest > 0:
                              fund_scale = str(latest)
                  except Exception:
                      pass

              return stock_codes, fund_scale

          def fetch_fund_data(fund_code, fund_info):
              """获取单只基金持仓+规模（含3次重试，递增延迟）
              并发请求 jjcc（持仓+权重）和 pingzhongdata（股票代码+规模）
              """
              holdings = None
              stock_codes = None
              fund_scale = ''
              for retry in range(3):
                  # 并发请求 jjcc 和 pingzhongdata
                  with ThreadPoolExecutor(max_workers=2) as executor:
                      jjcc_future = executor.submit(fetch_jjcc, fund_code)
                      pz_future = executor.submit(fetch_pingzhongdata, fund_code)
                      holdings = jjcc_future.result()
                      stock_codes, fund_scale = pz_future.result()
                  if holdings is not None:
                      break
                  time.sleep(1 + retry * 2)
              return fund_code, fund_info, holdings, stock_codes, fund_scale

          # 并发配置
          CONCURRENCY = 3          # 3个并发线程
          BATCH_WRITE_THRESHOLD = 1000  # 每1000条写入一次文件

          updated_count = 0
          failed_count = 0
          pending_writes = 0
          time_limit_hit = False

          # TODO 625: 36进制编码函数
          CHARS36 = '0123456789abcdefghijklmnopqrstuvwxyz'
          def to_base36(n, width=3):
              """将数字转为36进制定长字符串"""
              if n < 0:
                  n = 0
              s = ''
              if n == 0:
                  s = '0'
              else:
                  while n > 0:
                      s = CHARS36[n % 36] + s
                      n //= 36
              return s.rjust(width, '0')

          same_fund_file = 'data/same_fund_to_code_c.json'

          def save_cache():
              """事务式保存 3 个文件（先写所有临时文件，全部完成后原子替换）"""
              # 1. 准备主数据（消费方使用：last_update + stocks + funds）
              existing['last_update'] = today_str
              existing['stocks'] = existing_stocks
              existing['funds'] = existing_funds
              # 2. 准备状态数据（定期任务使用：main_run_date + updates）
              all_updated = list(updated_code_set | set(existing_funds.keys()))
              existing_updates[skip_date] = ','.join(sorted(all_updated))
              state['updated_count'] = len(existing_funds)
              state['total_count'] = len(existing_funds)
              state['updates'] = existing_updates
              # 3. 先写所有临时文件
              tmp_files = []
              for fp, data in [(cache_file, existing), (state_file, state), (same_fund_file, same_fund_to_c)]:
                  tmp = fp + '.tmp'
                  with open(tmp, 'w', encoding='utf-8') as f:
                      json.dump(data, f, ensure_ascii=False, separators=(',', ':'))
                  tmp_files.append((tmp, fp))
              # 4. 全部写入成功后，依次原子替换
              for tmp, fp in tmp_files:
                  os.replace(tmp, fp)

          print(f'Starting concurrent fetch: {len(funds_to_update)} funds, concurrency={CONCURRENCY}')

          with ThreadPoolExecutor(max_workers=CONCURRENCY) as executor:
              for i in range(0, len(funds_to_update), CONCURRENCY):
                  # 检查时间限制
                  elapsed = time.time() - run_start_time
                  if elapsed > MAX_RUNTIME:
                      print(f'Time limit reached ({elapsed/3600:.1f}h), saving checkpoint')
                      time_limit_hit = True
                      break

                  batch = funds_to_update[i:i + CONCURRENCY]
                  futures = {executor.submit(fetch_fund_data, fc, info): (fc, info) for fc, info in batch}

                  for future in as_completed(futures):
                      try:
                          fc, info, holdings, stock_codes, fund_scale = future.result()
                      except Exception as e:
                          print(f'Error: {e}', file=sys.stderr)
                          failed_count += 1
                          continue

                      if holdings is None:
                          failed_count += 1
                          continue

                      # 记录到已更新集合（含0-holdings，避免重复拉取）
                      updated_code_set.add(fc)

                      # 跳过无重仓股的基金（债券/货币基金等，不存入funds但记入updates）
                      if not holdings or len(holdings) == 0:
                          # 从funds中移除（如果之前存在）
                          existing_funds.pop(fc, None)
                          updated_count += 1
                          pending_writes += 1
                          continue

                      # TODO 626: 基金规模从 pingzhongdata Data_fluctuationScale 获取
                      # 优先使用 pingzhongdata 的规模，C类为空则回退A类scale
                      if not fund_scale:
                          for a_code in c2a_map.get(fc, []):
                              # A类没有 pingzhongdata 规模，跳过
                              pass
                      if not fund_scale:
                          fund_scale = existing_funds.get(fc, {})[0] if isinstance(existing_funds.get(fc, {}), list) and existing_funds.get(fc, {}) else ''
                      # 校验规模，负数或非数字置空
                      if fund_scale:
                          try:
                              if float(fund_scale) < 0:
                                  fund_scale = ''
                          except (ValueError, TypeError):
                              fund_scale = ''

                      # TODO 626: stockCodes 交叉验证
                      # 比较 pingzhongdata 的 stockCodes 和 jjcc 解析出的股票代码
                      # 不限定代码长度（A股6位、港股5位、美股字母均参与比对）
                      if stock_codes:
                          jjcc_codes = set(item[0] for item in holdings if item[0])
                          pz_codes = set(stock_codes)
                          # 期望至少60%的股票代码匹配（jjcc是前10大，stockCodes也是前10大）
                          if jjcc_codes and pz_codes:
                              overlap = jjcc_codes & pz_codes
                              if len(overlap) < len(jjcc_codes) * 0.4:
                                  print(f'  [WARN] {fc}: stockCodes交叉验证异常, jjcc={len(jjcc_codes)} pz={len(pz_codes)} overlap={len(overlap)}')

                      # TODO 625: h用36进制编码字符串，funds用数组格式 [scale, h_str]
                      # jjcc 返回 [[code, name, weight], ...] → "3位36进制序号3位36进制占比..." 字符串
                      # 股票名查表得到序号（新增则追加到 stocks 数组），序号36进制3位
                      # 占比×100转整数，36进制3位
                      h_str = ''
                      for item in holdings:
                          if len(item) >= 3:
                              stock_name = item[1]
                              weight = item[2]
                          elif len(item) == 2:
                              stock_name = item[0]
                              weight = item[1]
                          else:
                              continue
                          if not stock_name:
                              continue
                          # 股票名查表（新增则追加）
                          if stock_name not in stock_name_to_idx:
                              stock_name_to_idx[stock_name] = len(existing_stocks)
                              existing_stocks.append(stock_name)
                          stock_idx = stock_name_to_idx[stock_name]
                          # 占比×100转整数
                          weight_int = int(round(weight * 100))
                          h_str += to_base36(stock_idx, 3) + to_base36(weight_int, 3)

                      # funds用数组格式 [scale, h_str]，省去 "s": 和 "h": key
                      existing_funds[fc] = [fund_scale, h_str]
                      updated_count += 1
                      pending_writes += 1

                  # 每1000条写入一次文件
                  if pending_writes >= BATCH_WRITE_THRESHOLD:
                      save_cache()
                      print(f'  [Checkpoint] {updated_count} funds written (progress: {i + len(batch)}/{len(funds_to_update)})')
                      pending_writes = 0

                  # 进度日志（每50批输出一次）
                  batch_num = i // CONCURRENCY
                  if batch_num % 50 == 0:
                      elapsed = time.time() - run_start_time
                      print(f'Progress: batch {batch_num}, {i + len(batch)}/{len(funds_to_update)}, updated={updated_count}, failed={failed_count}, elapsed={elapsed/60:.0f}min')

                  # 批次间随机延迟0.5-1s（避免被封）
                  time.sleep(random.uniform(0.5, 1))

          # ========== 6. 最终保存 ==========
          save_cache()

          # TODO 623: 断点续传统计改为使用 updated_code_set
          quarter_done = len(updated_code_set)
          print(f'\\nDone: updated={updated_count}, failed={failed_count}, skipped={skipped_count}')
          print(f'Quarter progress: {quarter_done}/{total} funds updated ({quarter_done*100//total}%)')
          if time_limit_hit:
              remaining = total - quarter_done
              print(f'Time limit hit, {remaining} funds remaining for next run')
          else:
              print('All funds processed!')

          if updated_count > 0:
              with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
                  f.write('data_updated=true\n')
          PYEOF

      - name: Commit and push if changed
        if: steps.fetch-data.outputs.data_updated == 'true'
        run: |
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add data/fund-holdings-cache.json data/fund-holdings-cache-state.json data/same_fund_to_code_c.json
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            today=$(TZ='Asia/Shanghai' date +%Y-%m-%d)
            git commit -m "chore: update fund holdings cache ${today}"
            git pull --rebase origin main || echo "git pull failed, will attempt push anyway"
            git push
          fi

      - name: Setup Pages
        if: steps.fetch-data.outputs.data_updated == 'true'
        uses: actions/configure-pages@v5

      - name: Upload artifact
        if: steps.fetch-data.outputs.data_updated == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        if: steps.fetch-data.outputs.data_updated == 'true'
        id: deployment
        uses: actions/deploy-pages@v4
