name: Update Streak Rank

on:
  schedule:
    # 第一次：北京时间凌晨 2 点（UTC 18:00）
    - cron: '0 18 * * *'
    # 第二次兜底：北京时间早上 8 点（UTC 00:00），第一次后 6 小时重试
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: streak-rank
  cancel-in-progress: false

jobs:
  update-streak-rank:
    environment:
      name: github-pages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0  # 拉取完整历史，便于 git pull

      # 关键修复：actions/checkout 在 schedule 触发时拉取的是 workflow run 创建时的 commit SHA，
      # 而不是执行时的最新 commit。concurrency group 排队等待时，前一个 run 可能已经 commit，
      # 但当前 run 的 checkout 仍然是旧的，导致 already_done 检查失效，重复 fetch 并累加 streak_days。
      # 解决方案：checkout 后立即 git pull，确保拿到最新代码。
      - name: Pull latest changes
        run: |
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git pull --rebase origin main || echo "git pull failed (maybe no upstream or conflict), continue with checkout state"

      - name: Get latest trade date and check if already done
        id: check
        run: |
          python3 << 'EOF'
          import datetime, zoneinfo, json, os
          tz_bj = zoneinfo.ZoneInfo('Asia/Shanghai')
          today = datetime.datetime.now(tz_bj).date()
          holidays_2026 = {
              '2026-01-01','2026-01-02','2026-01-03',
              '2026-02-16','2026-02-17','2026-02-18','2026-02-19','2026-02-20',
              '2026-04-04','2026-04-05','2026-04-06',
              '2026-05-01','2026-05-02','2026-05-03','2026-05-04','2026-05-05',
              '2026-05-30','2026-05-31','2026-06-01',
              '2026-10-01','2026-10-02','2026-10-03','2026-10-04','2026-10-05','2026-10-06','2026-10-07',
          }
          # 回溯查找最近的交易日（不包含今天）作为 ed
          d = today - datetime.timedelta(days=1)
          while d.weekday() >= 5 or d.isoformat() in holidays_2026:
              d -= datetime.timedelta(days=1)
          ed = d
          # sd = ed 前一个交易日（左开右闭区间）
          sd = ed - datetime.timedelta(days=1)
          while sd.weekday() >= 5 or sd.isoformat() in holidays_2026:
              sd -= datetime.timedelta(days=1)

          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              f.write(f'ed={ed.isoformat()}\n')
              f.write(f'sd={sd.isoformat()}\n')

          # 检查是否已完成：streak-rank.json 和 calibration-ratio.json 都需要更新到 ed
          # 只有两者都已完成（last_trade_date == ed 且数据非空）才跳过
          # 兜底：上次异常写入（last_trade_date 更新但数据空）时强制重试
          already_done = 'false'
          streak_done = False
          calib_done = False

          try:
              with open('data/streak-rank.json', encoding='utf-8') as f:
                  data = json.load(f)
              last_trade_date = data.get('last_trade_date', '')
              funds = data.get('funds', [])
              if last_trade_date == ed.isoformat() and len(funds) > 0:
                  streak_done = True
                  print(f'Streak rank done: last_trade_date={last_trade_date}, funds={len(funds)}')
              elif last_trade_date == ed.isoformat() and len(funds) == 0:
                  print(f'Streak rank retry needed: last_trade_date={last_trade_date} but funds empty')
              else:
                  print(f'Streak rank not done: last_trade_date={last_trade_date} != ed={ed.isoformat()}')
          except FileNotFoundError:
              print('No existing streak-rank.json')
          except Exception as e:
              print(f'Streak rank check failed: {e}')

          try:
              with open('data/calibration-ratio.json', encoding='utf-8') as f:
                  data = json.load(f)
              last_trade_date = data.get('last_trade_date', '')
              funds = data.get('funds', {})
              if last_trade_date == ed.isoformat() and len(funds) > 0:
                  calib_done = True
                  print(f'Calibration done: last_trade_date={last_trade_date}, funds={len(funds)}')
              elif last_trade_date == ed.isoformat() and len(funds) == 0:
                  print(f'Calibration retry needed: last_trade_date={last_trade_date} but funds empty')
              else:
                  print(f'Calibration not done: last_trade_date={last_trade_date} != ed={ed.isoformat()}')
          except FileNotFoundError:
              print('No existing calibration-ratio.json')
          except Exception as e:
              print(f'Calibration check failed: {e}')

          if streak_done and calib_done:
              already_done = 'true'
              print('Both streak-rank and calibration are up-to-date, skip fetch')

          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              f.write(f'already_done={already_done}\n')
          EOF

      - name: Fetch streak rank data
        if: steps.check.outputs.already_done != 'true'
        id: fetch-data
        env:
          ED: ${{ steps.check.outputs.ed }}
          SD: ${{ steps.check.outputs.sd }}
        run: |
          mkdir -p data
          python3 << 'EOF'
          import json, urllib.request, urllib.parse, sys, datetime, zoneinfo, os, re

          tz_bj = zoneinfo.ZoneInfo('Asia/Shanghai')
          now_bj = datetime.datetime.now(tz_bj)

          ed = os.environ.get('ED', '')
          sd = os.environ.get('SD', '')
          if not ed or not sd:
              print('ERROR: ed/sd not set', file=sys.stderr)
              sys.exit(1)

          print(f'ed={ed}, sd={sd}')

          def hash_v(s):
              h = 0
              for c in s:
                  h = ((h << 5) - h) + ord(c)
                  h &= 0xFFFFFFFF
              return str(h)

          # ft=all 已包含全部基金（含 fof/qdii），只需查询一次
          all_funds = {}
          page = 1
          page_size = 10000
          while True:
              v = hash_v(ed + str(page))
              params = {
                  'op': 'dy', 'dt': 'kf', 'ft': 'all', 'rs': '', 'gs': '0',
                  'sc': 'qjzf', 'st': 'desc', 'sd': sd, 'ed': ed, 'es': '0',
                  'qdii': '', 'pi': str(page), 'pn': str(page_size), 'dx': '0', 'v': v
              }
              url = 'https://fund.eastmoney.com/data/rankhandler.aspx?' + urllib.parse.urlencode(params)
              req = urllib.request.Request(url, headers={
                  'Referer': 'https://fund.eastmoney.com/data/diyfundranking.html',
                  'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36'
              })
              try:
                  with urllib.request.urlopen(req, timeout=30) as resp:
                      text = resp.read().decode('utf-8')
              except Exception as e:
                  print(f'Fetch failed page={page}: {e}', file=sys.stderr)
                  break

              # ⚠️ 响应不是合法 JSON：字段名无引号（{datas:[...],allRecords:25580}）
              # 不能用 json.loads 解析整个对象，需用正则单独提取 datas 数组和 allRecords
              # datas 数组本身是合法 JSON 字符串数组（["...","..."]），可以直接 loads
              datas_match = re.search(r'datas:\s*(\[.*?\])\s*,\s*allRecords', text, re.DOTALL)
              if not datas_match:
                  print(f'No datas array found page={page}', file=sys.stderr)
                  break
              try:
                  datas = json.loads(datas_match.group(1))
              except json.JSONDecodeError as e:
                  print(f'datas array parse failed page={page}: {e}', file=sys.stderr)
                  break

              if not datas:
                  break

              all_records_match = re.search(r'allRecords:\s*(\d+)', text)
              all_records = int(all_records_match.group(1)) if all_records_match else 0

              for item in datas:
                  fields = item.split(',')
                  if len(fields) < 4:
                      continue
                  fund_code = fields[0].strip()
                  fund_name = fields[1].strip() if len(fields) > 1 else ''
                  range_gain_str = fields[3].strip() if len(fields) > 3 else ''
                  # fields[9] 是区间结束日期，fields[10] 是区间结束单位净值
                  nav_date = fields[9].strip() if len(fields) > 9 else ed
                  # TODO 593: 提取单位净值（fields[10]），用于生成 fund-nav-cache.json
                  unit_nav_str = fields[10].strip() if len(fields) > 10 else ''
                  try:
                      unit_nav = float(unit_nav_str) if unit_nav_str else None
                  except ValueError:
                      unit_nav = None

                  if not fund_code:
                      continue

                  # 解析涨幅
                  try:
                      range_gain = float(range_gain_str) if range_gain_str else None
                  except ValueError:
                      range_gain = None

                  if range_gain is None:
                      # 无数据，视为非上涨
                      all_funds[fund_code] = {
                          'fund_code': fund_code,
                          'fund_name': fund_name,
                          'daily_gain': None,
                          'nav_date': nav_date,
                          'unit_nav': unit_nav,
                      }
                  else:
                      all_funds[fund_code] = {
                          'fund_code': fund_code,
                          'fund_name': fund_name,
                          'daily_gain': range_gain,
                          'nav_date': nav_date,
                          'unit_nav': unit_nav,
                      }

              if page * page_size >= all_records or len(datas) < page_size:
                  break
              page += 1

          print(f'Total funds fetched: {len(all_funds)}')

          # 校验：只有成功获取数据才写入，否则视为失败跳过写入（下次重试）
          if len(all_funds) == 0:
              print('No funds fetched, skip write (will retry next run)', file=sys.stderr)
              sys.exit(0)  # 正常退出但不写入，不触发 data_updated

          # 读取现有 streak-rank.json
          existing = {'last_update': '', 'last_trade_date': '', 'funds': []}
          try:
              with open('data/streak-rank.json', encoding='utf-8') as f:
                  existing = json.load(f)
          except FileNotFoundError:
              pass
          except Exception as e:
              print(f'Read existing failed: {e}', file=sys.stderr)

          # 防御性检查：如果 existing.last_trade_date == ed 且 funds 非空，
          # 说明今天已经更新过（可能是 git pull 后发现 already_done，或并发执行导致 checkout 旧代码），
          # 跳过 streak_days 累加，直接复用 existing.funds，避免重复累加。
          # 注意：仍然继续执行 calibration-ratio.json 的更新（calibration 有独立的 already_calibrated_today 检查）。
          skip_streak_update = (
              existing.get('last_trade_date') == ed
              and len(existing.get('funds', [])) > 0
          )
          if skip_streak_update:
              print(f'Defensive check: streak-rank already updated for ed={ed} (last_trade_date={existing.get("last_trade_date")}, funds={len(existing.get("funds", []))}), skip streak_days accumulation')

          existing_map = {f['fund_code']: f for f in existing.get('funds', [])}

          # 更新连涨数据
          result_funds = []
          if skip_streak_update:
              # 防御性检查命中：直接复用 existing.funds，不累加 streak_days
              # 但需要用本次 fetch 的 latest_daily_gain 和 latest_nav_date 更新（保持数据新鲜）
              for old_item in existing.get('funds', []):
                  code = old_item.get('fund_code', '')
                  new_info = all_funds.get(code, {})
                  daily_gain = new_info.get('daily_gain')
                  # 当日非上涨则从连涨列表移除（end streak）
                  if daily_gain is None or daily_gain <= 0:
                      continue
                  result_funds.append({
                      'fund_code': code,
                      'fund_name': old_item.get('fund_name', new_info.get('fund_name', '')),
                      'streak_days': old_item.get('streak_days', 1),
                      'streak_gain': old_item.get('streak_gain', 0),
                      'latest_daily_gain': round(daily_gain, 4),
                      'latest_nav_date': new_info.get('nav_date', old_item.get('latest_nav_date', ed)),
                  })
          else:
              for code, info in all_funds.items():
                  daily_gain = info.get('daily_gain')
                  fund_name = info.get('fund_name', '')
                  nav_date = info.get('nav_date', ed)

                  if daily_gain is None or daily_gain <= 0:
                      # 当日无数据或非上涨，从连涨列表中移除
                      continue

                  old = existing_map.get(code)
                  if old:
                      # 已在连涨列表：天数+1，涨幅累加
                      streak_days = old.get('streak_days', 0) + 1
                      streak_gain = round(old.get('streak_gain', 0) + daily_gain, 4)
                  else:
                      # 新增：连涨天数=1
                      streak_days = 1
                      streak_gain = round(daily_gain, 4)

                  result_funds.append({
                      'fund_code': code,
                      'fund_name': fund_name,
                      'streak_days': streak_days,
                      'streak_gain': streak_gain,
                      'latest_daily_gain': round(daily_gain, 4),
                      'latest_nav_date': nav_date,
                  })

          # 按连涨天数降序，天数相同的按连涨涨幅降序
          result_funds.sort(key=lambda x: (-x['streak_days'], -x['streak_gain']))

          # 去重：同名基金只保留 C 类（前端 filterDuplicateFunds 逻辑）
          # 优先级：C类人民币=0 > C类=1 > A/B类人民币=2 > A/B类=3 > A类人民币=4 > A类=5 > 其他=10
          def get_base_fund_name(fund_name):
              """提取基金基础名称（去掉份额类别和币种后缀）"""
              CURRENCY = r'(?:人民币|美元|美元汇|美元现钞)'
              base = fund_name
              base = re.sub(r'[A-Z]类' + CURRENCY + r'$', '', base).strip()
              base = re.sub(r'\(.+?\)[A-Z]' + CURRENCY + r'$', '', base).strip()
              base = re.sub(r'[A-Z]\(' + CURRENCY + r'\)$', '', base).strip()
              base = re.sub(r'\(.+?\)[A-Z]$', '', base).strip()
              base = re.sub(r'\(.+?\)' + CURRENCY + r'[A-Z]$', '', base).strip()
              base = re.sub(CURRENCY + r'[A-Z]$', '', base).strip()
              patterns = [
                  r'\(A/B\).*', r'A/B\(.*', r'A\(', r'B\(', r'C\(', r'D\(', r'E\(', r'F\(', r'H\(', r'I\(', r'R\(', r'Y\(',
                  r'\(A\)', r'\(B\)', r'\(C\)', r'\(D\)', r'\(E\)', r'\(F\)', r'\(H\)', r'\(I\)', r'\(R\)', r'\(Y\)',
                  r'A/B$', r'A$', r'B$', r'C$', r'D$', r'E$', r'F$', r'H$', r'I$', r'R$', r'Y$',
              ]
              for p in patterns:
                  base = re.sub(p, '', base).strip()
              base = re.sub(r'\(.+?\)$', '', base).strip()
              return base

          def fund_class_priority(fund_name):
              """基金份额优先级（越小越高），C类优先"""
              is_rmb = '人民币' in fund_name
              is_usd = '美元' in fund_name
              is_ab = bool(re.search(r'A/B|A\\B|\(A/B\)|\(A\\B\)', fund_name))

              def has_class(letter):
                  return bool(re.search(rf'{letter}[类(]|{letter}\((?:人民币|美元|美元汇|美元现钞)\)|(.+?){letter}(?:人民币|美元|美元汇|美元现钞)|(.+?){letter}$|(?:人民币|美元|美元汇|美元现钞){letter}$|(?<=[^a-zA-Z0-9]){letter}$', fund_name))

              is_a = has_class('A') and not is_ab
              is_c = has_class('C')
              is_e = has_class('E')
              is_d = has_class('D')

              if is_c:
                  return 0 if is_rmb else 10 if is_usd else 1
              elif is_ab:
                  return 2 if is_rmb else 10 if is_usd else 3
              elif is_a:
                  return 4 if is_rmb else 10 if is_usd else 5
              elif is_e:
                  return 6 if is_rmb else 10 if is_usd else 7
              elif is_d:
                  return 8 if is_rmb else 10 if is_usd else 9
              return 10

          def deduplicate_funds(funds):
              """同名基金去重，每组只保留优先级最高的（C类优先）"""
              from collections import defaultdict
              groups = defaultdict(list)
              for f in funds:
                  base = get_base_fund_name(f['fund_name'])
                  groups[base].append(f)

              result = []
              for base, group in groups.items():
                  if len(group) == 1:
                      result.append(group[0])
                  else:
                      # 按优先级排序，取最高的
                      sorted_group = sorted(group, key=lambda x: fund_class_priority(x['fund_name']))
                      result.append(sorted_group[0])
              return result

          deduped_funds = deduplicate_funds(result_funds)
          print(f'After deduplication: {len(result_funds)} → {len(deduped_funds)} funds')

          result = {
              'last_update': now_bj.strftime('%Y-%m-%d %H:%M:%S'),
              'last_trade_date': ed,
              'funds': deduped_funds,
          }

          with open('data/streak-rank.json', 'w', encoding='utf-8') as f:
              json.dump(result, f, ensure_ascii=False, indent=2)

          print(f'Updated streak rank: {len(result_funds)} funds, last_trade_date={ed}')

          # TODO 593: 生成 fund-nav-cache.json（最小化基金净值缓存）
          # 格式：{ "date": "2026-07-30", "funds": { "000001": { "n": 1.2345, "g": 0.56 }, ... } }
          # n=单位净值, g=日涨幅(%)，仅包含有净值数据的基金，最小化 JSON 体积
          nav_cache = {
              'date': ed.isoformat(),
              'funds': {}
          }
          for code, info in all_funds.items():
              unit_nav = info.get('unit_nav')
              daily_gain = info.get('daily_gain')
              if unit_nav is not None and unit_nav > 0:
                  nav_cache['funds'][code] = {
                      'n': round(unit_nav, 4),
                      'g': round(daily_gain, 2) if daily_gain is not None else None,
                  }
          with open('data/fund-nav-cache.json', 'w', encoding='utf-8') as f:
              json.dump(nav_cache, f, ensure_ascii=False, separators=(',', ':'))
          print(f'Updated fund-nav-cache: {len(nav_cache["funds"])} funds, date={nav_cache["date"]}')

          # ========== 估值校准计算 ==========
          # 数据源：调用 FundValuationLast 批量接口获取估算涨幅(GSZZL)，
          #         配合 fundranking 已获取的实际涨幅(daily_gain)计算 EMA 校准系数(α=0.33)，
          #         保存为 calibration-ratio.json
          #
          # 历史背景（TODO 548）：
          #   - 原主路径使用 FundGuZhi/GetFundGZList 接口，但该接口已明确下线
          #     （返回 "Data": null，导致 AttributeError: 'NoneType' object has no attribute 'get'）
          #   - TODO 546 已添加 FundValuationLast 作为兜底，TODO 548 将其提升为唯一路径
          #   - 新浪接口（sina_ds2/sina_ds3）不支持批量，不适用于服务端校准
          #
          # 前端本地校准（localCalibration.ts）已支持任意数据源（包括新浪），
          #   因为它从 IDB 缓存读取 est_info.estimate_growth 和 lat_info.growth，
          #   与数据源无关。服务端校准仅用于生成 calibration-ratio.json。
          # JSON 最小化：只存 fund_code → ratio 映射

          # 1. 获取所有基金的估算涨幅和实际涨幅
          # FundValuationLast 返回 GSZZL(估算涨幅)，实际涨幅从 all_funds.daily_gain 取
          estimate_map = {}  # { fund_code: { 'estimate_growth': float, 'actual_growth': float, 'fund_name': str } }
          est_gzrq = ''  # 估值日期（取自 PDATE，缺失时回退到 ed）

          # FundValuationLast 批量接口：单次最多50只基金
          # 主域：fundcomapi.tiantianfunds.com，备用域：fundcomapi.eastmoney.com
          fund_codes_list = [fc for fc in all_funds.keys() if all_funds[fc].get('daily_gain') is not None]
          print(f'Funds to calibrate (with daily_gain): {len(fund_codes_list)}')
          batch_size = 50
          fallback_matched = 0
          for i in range(0, len(fund_codes_list), batch_size):
              batch = fund_codes_list[i:i + batch_size]
              fcodes = ','.join(batch)
              # 尝试主域和备用域
              for base_url in [
                  'https://fundcomapi.tiantianfunds.com/mm/newCore/FundValuationLast',
                  'https://fundcomapi.eastmoney.com/mm/newCore/FundValuationLast',
              ]:
                  fvl_url = f'{base_url}?FCODES={fcodes}&FIELDS=FCODE,SHORTNAME,GSZZL,GZTIME,GSZ,NAV,PDATE'
                  fvl_req = urllib.request.Request(fvl_url, headers={
                      'Referer': 'https://fund.eastmoney.com/',
                      'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36'
                  })
                  try:
                      with urllib.request.urlopen(fvl_req, timeout=30) as resp:
                          fvl_text = resp.read().decode('utf-8')
                      fvl_data = json.loads(fvl_text)
                      # 兼容 camelCase（实测）和 PascalCase 两种格式
                      err_code = fvl_data.get('errorCode', fvl_data.get('ErrCode'))
                      data_arr = fvl_data.get('data', fvl_data.get('Datas'))
                      if err_code != 0 or not isinstance(data_arr, list):
                          print(f'FundValuationLast batch {i//batch_size + 1} error on {base_url}: errCode={err_code}', file=sys.stderr)
                          continue
                      for item in data_arr:
                          fc = str(item.get('FCODE', item.get('fundcode', ''))).strip()
                          if not fc:
                              continue
                          gszzl = item.get('GSZZL', item.get('gszzl'))
                          jjjc = str(item.get('SHORTNAME', item.get('name', ''))).strip()
                          pdate = str(item.get('PDATE', item.get('jzrq', ''))).strip()[:10]
                          try:
                              est_growth = float(gszzl) if gszzl is not None else None
                          except (ValueError, TypeError):
                              est_growth = None
                          # 实际涨幅来自 fundranking 的 daily_gain
                          actual_growth = all_funds.get(fc, {}).get('daily_gain')
                          if est_growth is not None and actual_growth is not None:
                              estimate_map[fc] = {
                                  'estimate_growth': est_growth,
                                  'actual_growth': actual_growth,
                                  'fund_name': jjjc,
                              }
                              fallback_matched += 1
                          # 记录 PDATE 作为估值日期（取第一个有效的）
                          if not est_gzrq and pdate:
                              est_gzrq = pdate
                      break  # 成功，跳出备用域尝试
                  except Exception as e:
                      print(f'FundValuationLast batch {i//batch_size + 1} failed on {base_url}: {e}', file=sys.stderr)
                      continue
          # 若 PDATE 缺失，使用 ed 作为估值日期（fundranking 的 daily_gain 对应 ed）
          if not est_gzrq:
              est_gzrq = ed
          print(f'FundValuationLast matched: {fallback_matched} funds, est_gzrq={est_gzrq}')

          # 2. 读取现有 calibration-ratio.json 获取 prev_ema 和上次校准日期
          prev_calibrations = {}
          prev_last_trade_date = ''
          try:
              with open('data/calibration-ratio.json', encoding='utf-8') as f:
                  prev_data = json.load(f)
              prev_calibrations = prev_data.get('funds', {})
              prev_last_trade_date = prev_data.get('last_trade_date', '')
          except FileNotFoundError:
              pass
          except Exception as e:
              print(f'Read existing calibration failed: {e}', file=sys.stderr)

          # 3. 计算 EMA 校准系数
          # 校准基于估算涨幅(estimate_growth) 和实际涨幅(actual_growth)，
          # 数据源：FundValuationLast 的 GSZZL + fundranking 的 daily_gain，两者对应同一天(ed/PDATE)
          # 防重复保护：如果 est_gzrq == prev_last_trade_date，说明今天已校准过，保留旧值。
          ALPHA = 0.33
          new_calibrations = {}
          matched_count = 0
          skipped_opposite = 0

          # 同一天不重复更新 EMA（避免多次运行导致 EMA 偏移）
          already_calibrated_today = bool(est_gzrq) and bool(prev_calibrations) and (est_gzrq == prev_last_trade_date)

          if already_calibrated_today:
              print(f'Calibration already done for gzrq={est_gzrq}, keeping previous {len(prev_calibrations)} values')
              new_calibrations = prev_calibrations
          else:
              # 一次性重置：prev_ema > 2.0 的基金重置为 1.0（异常值无法通过 EMA 自然恢复）
              reset_count = 0
              for fc in list(prev_calibrations.keys()):
                  if prev_calibrations[fc] > 2.0:
                      prev_calibrations[fc] = 1.0
                      reset_count += 1
              if reset_count > 0:
                  print(f'Calibration reset: {reset_count} funds with ratio>2.0 reset to 1.0')

              for fc, info in estimate_map.items():
                  est_growth = info['estimate_growth']
                  actual_growth = info['actual_growth']
                  fund_name = info['fund_name']

                  if est_growth is None or est_growth == 0 or actual_growth is None:
                      continue

                  # 方向相反时跳过 EMA 更新（估值+但实际-，或估值-但实际+）
                  # 方向相反说明估值模型完全失效，daily_ratio 不反映真实校准关系
                  if (est_growth > 0 and actual_growth < 0) or (est_growth < 0 and actual_growth > 0):
                      skipped_opposite += 1
                      # 保留 prev_ema 不更新
                      if fc in prev_calibrations:
                          new_calibrations[fc] = prev_calibrations[fc]
                      continue

                  # 计算偏差比率
                  daily_ratio = actual_growth / est_growth
                  # 限制范围 [0.5, 2.0]：过滤极端异常值（如分红除权、数据错误），
                  # 收紧上限从 5.0 到 2.0，防止极端值累积导致 EMA 失控
                  clamped_ratio = max(0.5, min(2.0, daily_ratio))

                  # EMA 递推
                  prev_ema = prev_calibrations.get(fc)
                  if prev_ema is None or prev_ema == 0:
                      new_ratio = clamped_ratio
                  else:
                      new_ratio = ALPHA * clamped_ratio + (1 - ALPHA) * prev_ema

                  new_calibrations[fc] = round(new_ratio, 4)
                  matched_count += 1

              print(f'Calibration matched: {matched_count} funds, skipped_opposite: {skipped_opposite} (gzrq={est_gzrq})')

              if matched_count == 0 and len(estimate_map) > 0:
                  print('WARNING: FundValuationLast returned data but no funds matched for calibration', file=sys.stderr)
                  new_calibrations = prev_calibrations

          # 4. 去重：同名基金只保留 C 类（复用连涨榜去重逻辑）
          calib_with_name = []
          for fc, ratio in new_calibrations.items():
              name = estimate_map.get(fc, {}).get('fund_name', '')
              calib_with_name.append({'fund_code': fc, 'fund_name': name, 'ratio': ratio})

          deduped_calib = deduplicate_funds(calib_with_name)

          # 转回 { fund_code: ratio } 格式
          final_calibrations = {}
          for item in deduped_calib:
              final_calibrations[item['fund_code']] = item['ratio']

          print(f'Calibration after dedup: {len(new_calibrations)} → {len(final_calibrations)} funds')

          # 5. 保存 JSON（最小化格式：{ last_trade_date, funds: { code: ratio } }）
          # last_trade_date 使用 est_gzrq（估值日期），表示校准数据基于哪一天的 gszzl/jzzzl
          calib_result = {
              'last_trade_date': est_gzrq,
              'funds': final_calibrations,
          }

          with open('data/calibration-ratio.json', 'w', encoding='utf-8') as f:
              json.dump(calib_result, f, ensure_ascii=False, separators=(',', ':'))

          print(f'Updated calibration-ratio.json: {len(final_calibrations)} funds, last_trade_date={est_gzrq}')

          # 检查估值数据是否完全不可用（FundValuationLast 接口失败）
          if len(estimate_map) == 0:
              print('WARNING: FundValuationLast returned no estimate data. calibration-ratio.json not updated with new data.', file=sys.stderr)
          # 标记数据已更新，触发 commit 和 deploy 步骤
          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              f.write('data_updated=true\n')
          EOF

      # TODO 578: 拉取养基宝基金持有榜数据（含历史趋势）
      # 需要在仓库 Settings → Secrets → Actions 中配置 YJB_WX_WXUK 和 YJB_WX_COOKIE
      # 每日追加当日持有人数到 data/hold-count-ranking.json，基金数超过1000时移除末尾基金
      - name: Fetch hold count ranking
        if: steps.check.outputs.already_done != 'true'
        id: fetch-hold-count
        env:
          ED: ${{ steps.check.outputs.ed }}
          YJB_WX_WXUK: ${{ secrets.YJB_WX_WXUK }}
          YJB_WX_COOKIE: ${{ secrets.YJB_WX_COOKIE }}
        run: |
          mkdir -p data
          python3 << 'EOF'
          import json, urllib.request, urllib.parse, sys, datetime, zoneinfo, os, re, hashlib

          tz_bj = zoneinfo.ZoneInfo('Asia/Shanghai')
          now_bj = datetime.datetime.now(tz_bj)

          ed = os.environ.get('ED', '')
          wxuk = os.environ.get('YJB_WX_WXUK', '')
          cookie = os.environ.get('YJB_WX_COOKIE', '')

          # 凭证未配置时跳过（不影响 streak-rank 主流程）
          if not wxuk or not cookie:
              print('YJB_WX_WXUK or YJB_WX_COOKIE not set, skip hold count ranking fetch')
              with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
                  f.write('hold_count_updated=false\n')
              sys.exit(0)

          # 从 cookie 中提取 XSRF-TOKEN（URL 解码 %3D → =）
          xsrf_match = re.search(r'XSRF-TOKEN=([^;]+)', cookie)
          if not xsrf_match:
              print('XSRF-TOKEN not found in cookie, skip', file=sys.stderr)
              with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
                  f.write('hold_count_updated=false\n')
              sys.exit(0)
          try:
              xsrf_token = urllib.parse.unquote(xsrf_match.group(1))
          except Exception:
              xsrf_token = xsrf_match.group(1)

          # 计算养基宝微信网页版签名
          # 算法：SHA256(baseURL + urlPath + token + secret + timestamp)
          YJB_WX_BASE = 'https://wx.yangjibao.com/wxapi'
          YJB_WX_SECRET = 'FI1IUyhfbwOXiAkv1ZUR5WwmlIEsztLn'
          url_path = '/fund_hold_ranking'
          timestamp = int(now_bj.timestamp())
          sign_str = YJB_WX_BASE + url_path + wxuk + YJB_WX_SECRET + str(timestamp)
          request_sign = hashlib.sha256(sign_str.encode('utf-8')).hexdigest()

          # 请求持有榜（page=1, per_page=100，接口最大限制100）
          params = urllib.parse.urlencode({'page': 1, 'per_page': 100})
          url = f'{YJB_WX_BASE}{url_path}?{params}'
          headers = {
              'Host': 'wx.yangjibao.com',
              'Cookie': cookie,
              'authorization': wxuk,
              'x-xsrf-token': xsrf_token,
              'request-time': str(timestamp),
              'request-sign': request_sign,
              'accept': 'application/json, text/plain, */*',
              'content-type': 'application/json',
              'version': 'yjb_wxfwh-2.0.3',
              # User-Agent 必须包含 MicroMessenger，否则返回 401
              'user-agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/132.0.0.0 Safari/537.36 NetType/WIFI MicroMessenger/7.0.20.1781(0x6700143B) WindowsWechat(0x63090a13)',
              'sec-fetch-site': 'same-origin',
              'sec-fetch-mode': 'cors',
              'sec-fetch-dest': 'empty',
              'referer': 'https://wx.yangjibao.com/app/ranking/hold-count',
              'accept-language': 'zh-CN,zh;q=0.9',
          }
          req = urllib.request.Request(url, headers=headers)
          try:
              with urllib.request.urlopen(req, timeout=30) as resp:
                  raw = resp.read().decode('utf-8')
              result = json.loads(raw)
          except Exception as e:
              print(f'Fetch hold count ranking failed: {e}', file=sys.stderr)
              with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
                  f.write('hold_count_updated=false\n')
              sys.exit(0)

          if result.get('code') != 200 or not result.get('data'):
              print(f'Hold count ranking API error: code={result.get("code")}, message={result.get("message")}', file=sys.stderr)
              with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
                  f.write('hold_count_updated=false\n')
              sys.exit(0)

          data = result['data']
          hold_list = data.get('list', [])
          api_time = data.get('time', '')
          print(f'Fetched {len(hold_list)} funds from hold count ranking, api_time={api_time}')

          if not hold_list:
              print('Hold count ranking list empty, skip update', file=sys.stderr)
              with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
                  f.write('hold_count_updated=false\n')
              sys.exit(0)

          # 读取现有 hold-count-ranking.json
          existing = {'last_update': '', 'last_trade_date': '', 'funds': []}
          try:
              with open('data/hold-count-ranking.json', encoding='utf-8') as f:
                  existing = json.load(f)
          except FileNotFoundError:
              pass
          except Exception as e:
              print(f'Read existing hold-count-ranking.json failed: {e}', file=sys.stderr)

          # 防重复：如果 last_trade_date == ed 且 funds 非空，跳过当日追加
          if existing.get('last_trade_date') == ed and len(existing.get('funds', [])) > 0:
              print(f'Hold count ranking already updated for ed={ed}, skip')
              with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
                  f.write('hold_count_updated=false\n')
              sys.exit(0)

          # 构建当日 fund_code → { count, name } 映射
          today_map = {}
          for item in hold_list:
              code = item.get('code', '').strip()
              if not code:
                  continue
              today_map[code] = {
                  'count': item.get('near_1m_hold_count_num', 0),
                  'name': item.get('name', ''),
              }

          # 合并历史数据
          # existing.funds 结构：[{ fund_code, fund_name, hold_counts: { "2026-07-28": 12345, ... } }]
          existing_map = {f['fund_code']: f for f in existing.get('funds', [])}

          # 本次榜单中的基金（按当前排名顺序保留）
          result_funds = []
          for item in hold_list:
              code = item.get('code', '').strip()
              if not code:
                  continue
              name = item.get('name', '')
              count = item.get('near_1m_hold_count_num', 0)

              old = existing_map.get(code, {})
              old_counts = old.get('hold_counts', {})

              # 追加当日人数（仅当该日期不存在时才追加，避免重复）
              if ed not in old_counts:
                  new_counts = {**old_counts, ed: count}
              else:
                  new_counts = old_counts

              result_funds.append({
                  'fund_code': code,
                  'fund_name': name,
                  'hold_counts': new_counts,
              })

          # 限制基金数 ≤ 1000（按当前排名截断，末尾基金及历史一并移除）
          MAX_FUNDS = 1000
          if len(result_funds) > MAX_FUNDS:
              print(f'Truncating from {len(result_funds)} to {MAX_FUNDS} funds')
              result_funds = result_funds[:MAX_FUNDS]

          result = {
              'last_update': now_bj.strftime('%Y-%m-%d %H:%M:%S'),
              'last_trade_date': ed,
              'funds': result_funds,
          }

          with open('data/hold-count-ranking.json', 'w', encoding='utf-8') as f:
              json.dump(result, f, ensure_ascii=False, indent=2)

          print(f'Updated hold-count-ranking.json: {len(result_funds)} funds, last_trade_date={ed}')

          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              f.write('hold_count_updated=true\n')
          EOF

      - name: Commit and push if changed
        if: steps.fetch-data.outputs.data_updated == 'true' || steps.fetch-hold-count.outputs.hold_count_updated == 'true'
        run: |
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add data/streak-rank.json data/calibration-ratio.json data/hold-count-ranking.json data/fund-nav-cache.json
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            today=$(date +%Y-%m-%d)
            git commit -m "chore: update streak rank and calibration ${today}"
            git push
          fi

      - name: Keep alive
        if: steps.fetch-data.outputs.data_updated != 'true'
        run: |
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          LAST_COMMIT_DATE=$(git log -1 --format=%cd --date=short)
          TODAY=$(date +%Y-%m-%d)
          if [ "$LAST_COMMIT_DATE" != "$TODAY" ]; then
            echo "No commit today, creating keep-alive commit"
            mkdir -p data
            echo "${TODAY}" > data/.keep-alive
            git add data/.keep-alive
            git commit -m "chore: keep alive ${TODAY}"
            git push
          else
            echo "Already have a commit today (${TODAY}), skipping keep-alive"
          fi

      - name: Setup Pages
        if: steps.fetch-data.outputs.data_updated == 'true'
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload artifact
        if: steps.fetch-data.outputs.data_updated == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        if: steps.fetch-data.outputs.data_updated == 'true'
        id: deployment
        uses: actions/deploy-pages@v4

      # Supabase keep-alive ping（整合到定时任务中，无需单独的 keepalive workflow）
      # Supabase 免费项目 7 天无活动会暂停，本工作流每天执行 2 次，远小于 7 天阈值
      # if: always() 确保即使前面步骤失败也会执行 ping
      - name: Ping Supabase (keep-alive)
        if: always()
        run: |
          echo "Pinging Supabase Edge Function to prevent project pause..."
          curl -s -o /dev/null -w "Supabase ping: HTTP %{http_code}\n" \
            "https://cdgfbtemospbwxlyyxib.supabase.co/functions/v1/fund-proxy/health" \
            || echo "Supabase ping failed (non-fatal)"
